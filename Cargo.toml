[package]
name = "dfir-ogre-common"
version = "2.0.0-beta2"
edition = "2024"
description = "This project is part of the [DFIR-OGRE](https://github.com/ANSSI-FR/dfir-ogre) suite and provides a low level Rust runtime to run DFIR-OGRE plugins."
homepage = "https://github.com/ANSSI-FR/dfir-ogre-common"
repository = "https://github.com/ANSSI-FR/dfir-ogre-common"
documentation = "https://github.com/ANSSI-FR/dfir-ogre-common"
readme = "README.md"
license = "Apache-2.0"

[lib]
name = "dfir_ogre_common"
crate-type = ["cdylib", "lib"]

[dependencies]
# core lib
base64 = { version = "0.23.1" }
chrono = "0.4.45"
flate2 = { version = "1.1.10", features = ["zlib-rs"], default-features = false }
indexmap = "2.14.2"
log = { version = "0.4.34" }
# pyo3-log 0.13.4 requires PyO3 < 0.30.
pyo3 = { version = "0.29.3", features = ["abi3-py310", "chrono"] }
pyo3-log = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
thiserror = "2.0.21"
xmltree = { version = "0.12.0" }
zerocopy = { version = "0.8.63" }
blake3 = { version = "1.8.7" }
sevenz-rust2 = { version = "0.24.1" }

# file encoding
encoding_rs = { version = "0.8.42" }
encoding_rs_io = { version = "0.1.8" }

# parsing library
dfir-nt-hive = {  git = "https://github.com/ANSSI-FR/dfir-nt-hive.git" }
csv = { version = "1.4.0" }
libesedb = { version = "0.2.7" }
evtx = { version = "0.12.3" }
hex = "0.4.3"
regex = { version = "1.13.1" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sxd-document = { version = "0.3.2" }
sxd-xpath = { version = "0.4.2" }


[dev-dependencies]
rand = { version = "0.10.3" }

[profile.release]
strip = "debuginfo"
lto = true
panic = "abort"
codegen-units = 1
debug = false
